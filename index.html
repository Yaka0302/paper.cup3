<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>おんがくこうさくらんど</title>

<link rel="stylesheet" href="style.css?v=20260914-1">
</head>

<body>

<header>
  <h1>
    <span class="pink">おんがく</span>
    <span class="orange">こうさく</span>
    <span class="blue">らんど</span>
  </h1>

  <p>つくって うごかして おんがくあそび♪</p>

  <small style="display:block;text-align:center;color:#777">
    ver. 2026.09.14-1
  </small>
</header>


<main>

  <!-- あそびかた -->
  <section class="panel mode-panel">

    <h2>あそびかたを えらぼう</h2>

    <div class="mode-grid">

      <button
        id="normalModeBtn"
        class="mode-button selected"
        type="button"
      >
        🌈
        <span>つうじょうばん</span>
        <small>ふつうの おと・ふつうの はやさ</small>
      </button>


      <button
        id="careModeBtn"
        class="mode-button care"
        type="button"
      >
        🌿
        <span>はいりょばん</span>
        <small>ちいさな おと・ゆっくり すすむ</small>
      </button>

    </div>

  </section>


  <!-- 工作を選ぶ -->
  <section class="panel">

    <h2>6しゅるいから えらぼう</h2>

    <div
      id="craftGrid"
      class="grid"
    ></div>

  </section>


  <!-- 工作 -->
  <section class="panel">

    <h2 id="craftTitle"></h2>


    <img
      id="finishedPhoto"
      class="photo"
      src="rabbit.jpg"
      alt="うさぎの できあがりしゃしん"
    >


    <ol
      id="steps"
      class="steps"
    ></ol>


    <a
      id="pdfLink"
      class="pdf-button"
      href="rabbit-parts.pdf"
      download="rabbit-parts.pdf"
    >
      📄 A4の はりつけパーツを ダウンロード
    </a>


    <p class="help">
      ※ PDFを印刷して、線にそってパーツを切ってね。<br>
      紙コップには、すきな色の折り紙を貼って使ってね。
    </p>


    <button
      id="nextBtn"
      class="next"
      type="button"
    >
      こうさくが おわったら つぎへ ▶
    </button>

  </section>


  <!-- 音楽あそび -->
  <section
    id="cameraPanel"
    class="panel camera-panel"
  >

    <h2 id="cameraTitle"></h2>


    <div class="camera-frame">

      <video
        id="video"
        autoplay
        playsinline
        muted
      ></video>

    </div>


    <div
      id="guide"
      class="guide"
    >
      おんがくあそびが はじまるよ！
    </div>


    <div
      id="musicState"
      class="music-state"
    >
      🎵 やさしい おんがく
    </div>


    <div class="actions">

      <button
        id="replayBtn"
        class="purple"
        type="button"
      >
        🔁 もういちど
      </button>


      <button
        id="closeBtn"
        class="gray"
        type="button"
      >
        ◀ もどる
      </button>

    </div>

  </section>

</main>


<audio
  id="bgm"
  src="rabbit_soft.wav"
  loop
  preload="auto"
></audio>


<script
  src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"
></script>

<script src="app.js?v=20260914-1"></script>

</body>
</html>
